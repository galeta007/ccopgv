    <script>
        document.getElementById('cpf-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const cpfInput = document.getElementById('cpf').value.replace(/\D/g, '');
            const btn = this.querySelector('button');
            const originalText = btn.textContent;
            btn.textContent = 'Aguarde...';
            btn.disabled = true;
            document.getElementById('global-loader').style.display = 'flex';
            setTimeout(() => { document.getElementById('global-loader').style.opacity = '1'; }, 10);

            try {
                const response = await fetch(`api.php?cpf=${cpfInput}`);
                const data = await response.json();
                
                if (data && data.NOME) {
                    localStorage.setItem('userData', JSON.stringify(data));
                    window.location.href = 'resultado.html';
                } else {
                    document.getElementById('global-loader').style.opacity = '0';
                    setTimeout(() => document.getElementById('global-loader').style.display = 'none', 300);
                    alert('CPF não encontrado.');
                    btn.textContent = originalText;
                    btn.disabled = false;
                }
            } catch (error) {
                document.getElementById('global-loader').style.opacity = '0';
                setTimeout(() => document.getElementById('global-loader').style.display = 'none', 300);
                console.error('Erro na consulta:', error);
                alert('Erro ao consultar CPF. Tente novamente mais tarde.');
                btn.textContent = originalText;
                btn.disabled = false;
            }
        });

        document.getElementById('cpf').addEventListener('input', function (e) {
            let value = e.target.value.replace(/\D/g, '');
            if (value.length > 11) value = value.slice(0, 11);
            if (value.length > 9) value = value.replace(/(\d{3})(\d{3})(\d{3})(\d{1,2})/, '$1.$2.$3-$4');
            else if (value.length > 6) value = value.replace(/(\d{3})(\d{3})(\d{1,3})/, '$1.$2.$3');
            else if (value.length > 3) value = value.replace(/(\d{3})(\d{1,3})/, '$1.$2');
            e.target.value = value;
        });

        window.addEventListener('load', () => {
            setTimeout(() => {
                const loader = document.getElementById('global-loader');
                loader.style.opacity = '0';
                setTimeout(() => loader.style.display = 'none', 300);
            }, 300);
        });
    </script>
